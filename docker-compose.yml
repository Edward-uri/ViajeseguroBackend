services:
  api:
    build: .
    container_name: viajeseguro-api
    expose:
      - "3000"           
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app

  nginx:
    image: nginx:alpine
    container_name: viajeseguro-nginx
    depends_on:
      - api
    ports:
      - "80:80"
      # - "443:443"      # habilitar cuando tengamos certificado SSL
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    driver: bridge
